# Local/production-ish stack: API + crawl worker + Redis.
# MONGO_DB_URI comes from backend/.env (Atlas or a local Mongo).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    command: npm start
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: npm run worker
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
